<div class="control-section">

        that Adobe Reader or its equivalent is required to view the resultant document.
    </div>
    <div class="button-section" style="margin-left: 20px; margin-top: 20px;"> <!-- Added margin-top -->
        <div id="button-control">
            <div class="row">
                <input id="shapebtn" class="e-btn" value="Generate PDF"
                    style="width: 150px; text-transform:capitalize" />
            </div>
        </div>
    </div>
</div>
<div id="action-description">
    This sample demonstrates drawing of <a

</div>
